<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Валентинка 💘</title>
  <style>
    :root{
      --bg1:#0b0b12;
      --bg2:#1a0b1f;
      --card: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
      --accent:#ff4d7d;
      --accent2:#ff9ab5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: radial-gradient(1200px 800px at 20% 10%, #2a0f2f 0%, transparent 50%),
                  radial-gradient(900px 700px at 80% 20%, #3b0f25 0%, transparent 55%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* Hearts layer */
    #hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity .6s ease;
    }
    #hearts.active { opacity: 1; }

    .heart {
      position: absolute;
      top: -10vh;
      font-size: 18px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
      animation: fall linear forwards;
      user-select: none;
      will-change: transform, opacity;
    }

    @keyframes fall {
      0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 0; }
      10%{ opacity: 1; }
      100%{ transform: translate3d(var(--drift), 120vh, 0) rotate(var(--rot)); opacity: 0; }
    }

    /* Center card */
    .wrap{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      position:relative;
      z-index:2;
    }
    .card{
      width:min(520px, 100%);
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: 22px;
      padding: 26px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      text-align:center;
    }
    h1{
      margin: 6px 0 10px;
      font-size: clamp(26px, 4.2vw, 34px);
      letter-spacing: .2px;
    }
    p{
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.45;
    }
    .btns{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 10px;
    }
    button{
      border:0;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 16px;
      cursor:pointer;
      transition: transform .08s ease, filter .2s ease, background .2s ease;
      user-select:none;
    }
    button:active{ transform: translateY(1px) scale(.99); }

    .yes{
      background: linear-gradient(135deg, var(--accent), #ff2f67);
      color:white;
      box-shadow: 0 12px 30px rgba(255, 77, 125, .25);
    }
    .yes:hover{ filter: brightness(1.05); }

    .no{
      background: rgba(255,255,255,.10);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.16);
    }
    .no:hover{ filter: brightness(1.06); }

    /* Result view */
    .result{
      display:none;
    }
    .result.active{
      display:block;
      animation: pop .4s ease;
    }
    @keyframes pop{
      from{ transform: scale(.98); opacity:0; }
      to{ transform: scale(1); opacity:1; }
    }
    .gifbox{
      margin-top: 16px;
      border-radius: 18px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.2);
    }
    .gifbox img{
      display:block;
      width:100%;
      height:auto;
    }
    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      justify-content:center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,77,125,.16);
      border: 1px solid rgba(255,77,125,.25);
      color: #ffdbe5;
      font-weight: 600;
      margin-top: 6px;
    }
    .small{
      font-size: 13px;
      opacity: .85;
      margin-top: 10px;
    }
    a{ color: #ffd0dc; }
  </style>
</head>
<body>
  <div id="hearts" aria-hidden="true"></div>

  <div class="wrap">
    <div class="card" id="card">
      <!-- Question -->
      <div id="question">
        <div class="badge">💘 Валентинка</div>
        <h1>Станешь ли моей валентинкой?</h1>
        <p></p>

        <div class="btns">
          <button class="yes" id="yesBtn">Да!</button>
          <button class="no" id="noBtn">Нет…</button>
        </div>

        <p class="small"></p>
      </div>

      <!-- Result -->
      <div class="result" id="result">
        <div class="badge">❤️ </div>
        <h1></h1>
        <p>Неймовірні очі</p>

        <div class="gifbox">
          <img id="gif" alt="Милая гифка" />
        </div>

        <p class="small">от Шевеля</p>
      </div>
    </div>
  </div>

  <script>
    const GIF_URL = "https://media.tenor.com/Bx6jeMy-c-sAAAAM/cristiano-ronaldo-cr7.gif";

    const heartsLayer = document.getElementById('hearts');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const question = document.getElementById('question');
    const result = document.getElementById('result');
    const gif = document.getElementById('gif');

    // Optional: легкий “прикол” — кнопка Нет двигается
    let dodges = 0;
    noBtn.addEventListener('mouseenter', () => {
      // чтобы не бесило — только 3 раза
      if (dodges >= 3) return;
      dodges++;

      const card = document.getElementById('card');
      const rect = card.getBoundingClientRect();

      // случайная позиция внутри карточки
      const x = Math.random() * (rect.width - 120) + 20;
      const y = Math.random() * (rect.height - 60) + 20;

      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener('click', () => {
      // показать сердечки
      heartsLayer.classList.add('active');
      startHearts();

      // переключить экран
      question.style.display = 'none';
      result.classList.add('active');

      // поставить гифку
      gif.src = GIF_URL;
    });

    // Hearts generator
    let heartsTimer = null;

    function startHearts(){
      if (heartsTimer) return;

      // сгенерировать много сразу
      for (let i = 0; i < 18; i++) spawnHeart(true);

      heartsTimer = setInterval(() => spawnHeart(false), 220);
    }

    function spawnHeart(initial){
      const el = document.createElement('div');
      el.className = 'heart';
      el.textContent = Math.random() < 0.5 ? '❤️' : '💖';

      const left = Math.random() * 100; // vw
      const size = 14 + Math.random() * 22; // px
      const duration = 4.5 + Math.random() * 4.5; // s
      const drift = (Math.random() * 18 - 9).toFixed(1) + 'vw';
      const rot = (Math.random() * 260 - 130).toFixed(0) + 'deg';

      el.style.left = left + 'vw';
      el.style.fontSize = size + 'px';
      el.style.setProperty('--drift', drift);
      el.style.setProperty('--rot', rot);
      el.style.animationDuration = duration + 's';

      // чтобы сразу не было скучно — часть появляется ниже
      if (initial) el.style.top = (Math.random()*40 - 20) + 'vh';

      heartsLayer.appendChild(el);

      // удалить после анимации
      setTimeout(() => el.remove(), duration * 1000);
    }
  </script>
</body>
</html>
